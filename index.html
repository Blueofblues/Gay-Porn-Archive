<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Archive Access</title>
<style>
    body {
        background-color: #111;
        color: #eee;
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 80px;
    }
    #box {
        background: #222;
        padding: 25px;
        width: 350px;
        margin: auto;
        border-radius: 10px;
        box-shadow: 0 0 10px #000;
    }
    input {
        padding: 10px;
        width: 80%;
        border-radius: 5px;
        border: none;
        margin-top: 10px;
    }
    button {
        padding: 10px 20px;
        margin-top: 15px;
        background: #4CAF50;
        border: none;
        border-radius: 5px;
        color: white;
        cursor: pointer;
    }
    #linkbox {
        margin-top: 20px;
        display: none;
    }
    a {
        color: #4CAF50;
        font-size: 18px;
    }
</style>
</head>
<body>

<div id="box">
    <h2>Archive Access</h2>
    <p>Enter your access password:</p>

    <p style="font-size:14px; opacity:0.7;">
        (Password hint: my favorite color)
    </p>

    <input type="password" id="pass" placeholder="Password">
    <button onclick="checkPass()">Unlock</button>

    <div id="linkbox">
        <p><strong>Archive Link:</strong></p>
        <a href="https://mega.nz/folder/7w8zkDJB#BGJr_L6g8BzsoqBdI8uNCQ" target="_blank">
            Open Archive
        </a>
    </div>
</div>

<script>
function checkPass() {
    const correct = "Blue";
    const entered = document.getElementById("pass").value;

    if (entered === correct) {
        document.getElementById("linkbox").style.display = "block";
    } else {
        alert("Incorrect password.");
    }
}
</script>

</body>
</html>
